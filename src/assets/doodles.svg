<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg" opacity="0.4">
 <defs>
  <pattern id="doodles" patternUnits="userSpaceOnUse" width="100" height="100">
   <!-- Simple geometric doodles simulation -->
   <circle cx="20" cy="20" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
   <path d="M50 10 Q70 30 50 50 T30 90" fill="none" stroke="currentColor" stroke-width="2"/>
   <rect x="70" y="60" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(45 75 65)"/>
   <path d="M10 80 L30 80 L20 60 Z" fill="none" stroke="currentColor" stroke-width="2"/>
   <circle cx="80" cy="20" r="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2,2"/>
  </pattern>
 </defs>
 <rect width="100%" height="100%" fill="url(#doodles)" />
</svg>
